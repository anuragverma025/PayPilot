<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F1F5F9"/>
      <stop offset="100%" stop-color="#E2E8F0"/>
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#635BFF"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="600" height="400" fill="url(#bgGrad)"/>
  
  <!-- Subtle Blueprint grid -->
  <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1" fill="#94A3B8" opacity="0.3"/>
  </pattern>
  <rect width="600" height="400" fill="url(#grid)"/>

  <!-- Laptop Screen Outer Chassis -->
  <rect x="120" y="60" width="360" height="225" rx="14" fill="#0F172A" stroke="#334155" stroke-width="4"/>
  
  <!-- Display Bezel & Glass -->
  <rect x="135" y="75" width="330" height="195" rx="6" fill="url(#screenGrad)"/>

  <!-- WebCam -->
  <circle cx="300" cy="68" r="3" fill="#64748B"/>
  <circle cx="300" cy="68" r="1.5" fill="#0EA5E9"/>

  <!-- Screen Content: Code / IDE UI Mockup -->
  <rect x="155" y="95" width="80" height="6" rx="3" fill="url(#accentGrad)"/>
  <rect x="155" y="115" width="120" height="5" rx="2.5" fill="#94A3B8" opacity="0.8"/>
  <rect x="155" y="130" width="180" height="5" rx="2.5" fill="#64748B" opacity="0.6"/>
  <rect x="175" y="145" width="140" height="5" rx="2.5" fill="#38BDF8" opacity="0.7"/>
  <rect x="175" y="160" width="100" height="5" rx="2.5" fill="#34D399" opacity="0.7"/>
  <rect x="155" y="175" width="60" height="5" rx="2.5" fill="#F472B6" opacity="0.7"/>
  <rect x="155" y="195" width="150" height="5" rx="2.5" fill="#94A3B8" opacity="0.5"/>

  <!-- PayPilot Brand watermark on screen -->
  <g transform="translate(370, 220)">
    <rect width="80" height="24" rx="6" fill="#1E293B" stroke="#334155" stroke-width="1"/>
    <text x="40" y="16" font-family="Inter, sans-serif" font-size="10" font-weight="600" fill="#E2E8F0" text-anchor="middle">PayPilot AI</text>
  </g>

  <!-- Laptop Base / Hinge Deck -->
  <path d="M70 290 C70 286, 74 284, 80 284 L520 284 C526 284, 530 286, 530 290 L550 315 C550 320, 546 324, 540 324 L60 324 C54 324, 50 320, 50 315 Z" fill="#E2E8F0" stroke="#CBD5E1" stroke-width="3"/>

  <!-- Trackpad indent -->
  <rect x="250" y="288" width="100" height="6" rx="3" fill="#CBD5E1"/>

  <!-- Reflection shadow -->
  <ellipse cx="300" cy="340" rx="250" ry="12" fill="#000000" opacity="0.08"/>
</svg>
